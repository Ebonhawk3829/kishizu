<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kishizu</title>
<style>
  :root {
    --bg: #16161a; --card: #1e1e24; --line: #2e2e38;
    --text: #e8e6e3; --muted: #9490a0; --accent: #7c6bb0;
    --ok: #4a9d6e; --warn: #c9a227; --bad: #b5544f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  /* Cap the width and centre it. On a wide monitor a full-bleed layout pushes
     controls to opposite edges, which means travelling the whole screen to go
     from the show list to the grading panel. */
  .wrap { max-width: 1180px; margin: 0 auto; }
  .attr-hint { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .attr-edit { width: 130px; padding: 3px 6px; font-size: 13px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; border: 1px solid var(--line); color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.no { color: var(--warn); border-color: var(--warn); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.bad { background: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cand {
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    margin-bottom: 8px; background: #191920;
  }
  .cand .title { font-size: 13px; margin-bottom: 6px; word-break: break-word; }
  .cand .why { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .ep { font-weight: 600; }
  .ep.unknown { color: var(--warn); }
  .hidden { display: none; }
  .offsets { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .offsets code { color: var(--text); }
  select, input {
    background: #12121a; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
  }
  .banner {
    padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
    background: #1f2a24; border: 1px solid var(--ok); font-size: 13px;
  }
  .banner.err { background: #2a1f1f; border-color: var(--bad); }
  .teach {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .cand.resolved { opacity: 0.65; font-size: 12px; padding: 4px 0; border: none; }
  .attr {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .attr-name { width: 90px; font-size: 12px; color: var(--dim); }
  .attr-val { flex: 1; font-size: 13px; }
  .attr-val.absent { color: var(--dim); font-style: italic; }
  .grades { display: flex; gap: 4px; }
  .grades button {
    padding: 3px 9px; font-size: 11px; border-radius: 4px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
  }
  .grades button.sel { color: #fff; border-color: currentColor; }
  .grades button.g-good.sel { background: #1f4d33; }
  .grades button.g-acceptable.sel { background: #4a4326; }
  .grades button.g-wrong.sel { background: #4d1f1f; }
</style>
</head>
<body>
<div class="wrap">

<h1>kishizu</h1>
<div class="sub">seasonal anime downloader &middot; training</div>

<div id="banner" class="banner hidden"></div>

<div class="card" id="panel-grade-any">
  <h2>Grade a release</h2>
  <div class="meta">Paste a Nyaa link or release title. Pick the show and episode, then mark each part good / acceptable / wrong.</div>
  <div class="row">
    <select id="any-show" style="flex:1"></select>
    <input id="any-ep" type="number" min="1" style="width:64px" title="episode">
  </div>
  <div class="row">
    <input id="any-title" type="text" placeholder="nyaa.si/view/... or [Group] Show - 07 [1080p]" style="flex:1">
    <button onclick="inspectAny()">Inspect</button>
  </div>
  <div id="any-grade-panel"></div>
</div>

<div id="panel-train" class="card hidden" style="margin-bottom:20px">
  <h2 id="train-title">Training</h2>
  <div class="meta" id="train-meta"></div>
  <div id="candidates"></div>
  <div class="teach">
    <div class="meta">Grade a release: paste a Nyaa link or a release title, then mark each part good / acceptable / wrong.</div>
    <div class="row">
      <input id="teach-title" type="text" placeholder="nyaa.si/view/... or [Group] Show - 07 [1080p]" style="flex:1">
      <input id="teach-ep" type="number" min="1" style="width:64px" title="episode">
      <button class="ghost" onclick="inspect()">Inspect</button>
    </div>
    <div id="grade-panel"></div>
  </div>
  <div class="row">
    <button onclick="commit()">Finish &amp; save</button>
    <button class="ghost" onclick="cancelTrain()">Cancel</button>
  </div>
  <div class="offsets" id="offsets"></div>
  <div id="resolved"></div>
</div>

<div class="grid" id="shows"></div>

</div>

<script>
let state = { active: false };

function el(id) { return document.getElementById(id); }
function show(id, yes) { el(id).classList.toggle('hidden', !yes); }

function banner(msg, isErr) {
  const b = el('banner');
  b.textContent = msg;
  b.classList.toggle('err', !!isErr);
  show('banner', !!msg);
}

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadShows() {
  const shows = await api('/shows');
  el('any-show').innerHTML = shows.map(s =>
    `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  el('shows').innerHTML = shows.map(s => `
    <div class="card">
      <h2>${escapeHtml(s.name)}</h2>
      <div class="meta">
        next ep ${s.next}${s.max ? ' / ' + s.max : ''}
        &middot; <span class="pill ${s.trained ? 'ok' : 'no'}">${s.trained ? 'trained' : 'untrained'}</span>
        &middot; <span class="pill ${s.needs_attention ? 'no' : ''}">${escapeHtml(s.state || 'unknown')}</span>
        &middot; <span class="meta">${s.downloaded} dl &middot; ${s.watched} watched &middot; ${s.deleted} deleted</span>
        ${s.next_schedule ? `<div>ep ${s.next_schedule.episode} ${s.next_schedule.status === 'aired'
          ? '<span style="color:var(--warn)">aired, not grabbed</span>'
          : 'airs ' + new Date(s.next_schedule.airs_at).toLocaleString(undefined, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>` : ''}
      </div>
      <div class="row">
        <label class="meta" for="ep-${s.id}">ep</label>
        <input id="ep-${s.id}" type="number" min="1" value="${s.next}" style="width:64px">
        <button onclick="startTrain(${s.id})">Train</button>
        <button class="ghost" onclick="watchedUpTo(${s.id}, document.getElementById('ep-${s.id}').value, '${escapeHtml(s.name).replace(/'/g, "\\'")}')"
          title="mark episodes 1..N watched, so they are never grabbed">Watched up to</button>
        ${s.trained ? `<button class="ghost" onclick="showOffsets(${s.id})">Offsets</button>
        <button class="ghost" onclick="resetShow(${s.id}, '${escapeHtml(s.name).replace(/'/g, "\\'")}')">Reset</button>` : ''}
      </div>
      <div class="offsets" id="off-${s.id}"></div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dayName(n) {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n] || '?';
}

// Mark episodes 1..n watched. This is the single way to record progress:
// it covers both "I've seen up to ep 12" on a first run and "I just
// finished ep 12" after watching, since both latch the same episodes.
//
// Only episodes with no state yet are touched, so an episode already
// downloading or downloaded is left alone.
async function watchedUpTo(showId, upto, name) {
  upto = parseInt(upto, 10);
  if (isNaN(upto) || upto < 1) { banner('Set an episode number first.', true); return; }
  if (!confirm(`Mark episodes 1..${upto} of ${name} as watched? They will never be auto-grabbed.`)) return;
  try {
    const r = await api('/api/watched-up-to', { show_id: showId, up_to: upto });
    banner(`${name}: ${r.newly_marked} episode(s) latched as watched.`);
    loadShows();
  } catch (e) { banner(e.message, true); }
}

function showOffsets(id) {
  fetch('/shows').then(r => r.json()).then(shows => {
    const s = shows.find(x => x.id === id);
    el('off-' + id).innerHTML = Object.keys(s.offsets).length
      ? 'offsets: ' + Object.entries(s.offsets).map(([g,o]) => `<code>${escapeHtml(g)}=${o}</code>`).join(', ')
      : 'no offsets';
  });
}

// The episode is chosen by the user at training time, not fixed to "next":
// which episode you train on is a judgement call (you may want one that has
// already aired and has several competing releases).
async function startTrain(showId) {
  banner('');
  const input = el('ep-' + showId);
  const ep = parseInt(input && input.value, 10) || 0;
  try {
    const r = await api('/api/train/start', { show_id: showId, episode: ep, seed_index: -1 });
    if (r.needs_seed) { renderSeedPicker(showId, ep, r); return; }
    state = r;
    renderTrain();
  } catch (e) { banner('Could not start: ' + e.message, true); }
}

async function resetShow(showId, name) {
  if (!confirm(`Clear learned offsets for ${name}? You can retrain afterwards.`)) return;
  try {
    await api('/api/train/reset', { show_id: showId });
    banner(`Cleared offsets for ${name}.`);
    loadShows();
  } catch (e) { banner(e.message, true); }
}

// The newest release is often the PREVIOUS episode, so we cannot safely guess a
// seed. Ask the user to pick the release that IS the target episode.
function renderSeedPicker(showId, ep, r) {
  show('panel-train', true);
  el('train-title').textContent = 'Pick a release for episode ' + ep;
  el('train-meta').textContent =
    r.show + ' — no release in the feed is obviously episode ' + ep + '. Choose the right one:';
  el('candidates').innerHTML = r.releases.map(c => `
    <div class="cand">
      <div class="title">
        <span class="ep ${c.episode ? '' : 'unknown'}">${c.episode ? 'ep' + c.episode : 'ep?'}</span>
        &nbsp;${escapeHtml(c.title)}
      </div>
      <div class="why">${c.seeders} seeders · ${escapeHtml(c.resolution || '?')} ${escapeHtml(c.codec || '')}</div>
      <div class="row">
        <button onclick="seedWith(${showId}, ${ep}, ${c.index})">Use this</button>
      </div>
    </div>
  `).join('');
  el('offsets').innerHTML = '';
}

async function seedWith(showId, ep, index) {
  try {
    state = await api('/api/train/start', { show_id: showId, episode: ep, seed_index: index });
    renderTrain();
  } catch (e) { banner(e.message, true); }
}

function renderTrain() {
  show('panel-train', state.active);
  if (!state.active) return;

  el('train-title').textContent = 'Training: ' + state.show;
  el('train-meta').textContent =
    `episode ${state.episode} · ${state.accepted} accepted · ${state.rejected} rejected`;

  el('candidates').innerHTML = state.candidates.map(c => `
    <div class="cand">
      <div class="title">
        <span class="ep ${c.episode ? '' : 'unknown'}">${c.episode ? 'ep' + c.episode : 'ep?'}</span>
        &nbsp;${escapeHtml(c.title)}
      </div>
      <div class="why">${escapeHtml(c.why)} · ${c.seeders} seeders · ${escapeHtml(c.resolution || '?')} ${escapeHtml(c.codec || '')}</div>
      <div class="row">
        <button onclick="answer(${c.index}, true)">Yes, this is ep ${state.episode}</button>
        <button class="bad" onclick="reject(${c.index})">No</button>
      </div>
    </div>
  `).join('') || '<div class="meta">Nothing more to ask.</div>';

  const offs = Object.entries(state.offsets || {});
  el('offsets').innerHTML = offs.length
    ? 'learned offsets: ' + offs.map(([g,o]) => `<code>${escapeHtml(g)}=${o}</code>`).join(', ')
    : '';

  // Show what the model now resolves on its own, so learning is visible.
  const res = state.resolved || [];
  el('resolved').innerHTML = res.length
    ? '<div class="meta">resolved without asking:</div>' + res.map(c => `
      <div class="cand resolved">
        <span class="ep">ep${c.episode}</span>&nbsp;${escapeHtml(c.title)}
      </div>`).join('')
    : '';
}

let grading = null;
let gradingAny = null;

// Standalone grading: works without an active training session, so a release
// can be graded the moment you see it rather than only mid-session.
async function inspectAny() {
  const input = el('any-title').value.trim();
  if (!input) { banner('Paste a Nyaa link or release title first.', true); return; }
  const showId = parseInt(el('any-show').value, 10);
  const ep = parseInt(el('any-ep').value, 10) || 1;
  try {
    const r = await api('/api/inspect', { input, show_id: showId, episode: ep });
    gradingAny = { release: r.release, episode: ep, show_id: showId, grades: {} };
    renderGradingInto('any-grade-panel', r, 'any');
  } catch (e) { banner(e.message, true); }
}

async function submitGradesAny() {
  if (!gradingAny) return;
  try {
    const rel = collectEdits('any', gradingAny.release);
    const r = await api('/api/grade', {
      title: rel.title,
      show_id: gradingAny.show_id,
      episode: gradingAny.episode,
      grades: gradingAny.grades,
      release: rel,
    });
    el('any-grade-panel').innerHTML = '';
    el('any-title').value = '';
    gradingAny = null;
    banner(r.notes.length ? 'Learned: ' + r.notes.join('; ') : 'No changes.');
    loadShows();
  } catch (e) { banner(e.message, true); }
}

async function inspect() {
  const input = el('teach-title').value.trim();
  if (!input) { banner('Paste a Nyaa link or release title first.', true); return; }
  const ep = parseInt(el('teach-ep').value, 10) || state.episode;
  try {
    const r = await api('/api/train/inspect', { input, episode: ep });
    grading = { release: r.release, episode: r.episode, grades: {} };
    renderGrading(r);
  } catch (e) { banner(e.message, true); }
}

// prefix keeps the two panels' buttons from selecting each other's elements.
function renderGradingInto(panelId, r, prefix) {
  const rel = r.release;
  el(panelId).innerHTML = `
    <div class="meta" style="margin-top:8px">${escapeHtml(rel.title)}</div>
    ${r.matched ? `<div class="meta">confidence ${(rel.confidence*100).toFixed(0)}% &middot; ${escapeHtml(r.why)}</div>`
                : `<div class="meta">not matched: ${escapeHtml(r.why)}</div>`}
    ${rel.attrs.map(a => `
      <div class="attr">
        <span class="attr-name">${escapeHtml(a.label)}</span>
        <span class="attr-val ${a.present ? '' : 'absent'}">
          ${a.editable
            ? `<input class="attr-edit" data-p="${prefix}" data-k="${a.key}" value="${escapeHtml(a.value)}" placeholder="absent">`
            : escapeHtml(a.value || 'absent')}
          ${a.hint ? `<span class="attr-hint">${escapeHtml(a.hint)}</span>` : ''}
        </span>
        <span class="grades">
          ${['good','acceptable','wrong'].map(g => `<button class="g-${g}" data-p="${prefix}" data-k="${a.key}" data-g="${g}" onclick="setGrade('${prefix}','${a.key}','${g}')">${g}</button>`).join('')}
        </span>
      </div>`).join('')}
    <div class="row">
      <button onclick="${prefix === 'any' ? 'submitGradesAny()' : 'submitGrades()'}">Apply grades</button>
      <button class="ghost" onclick="el('${panelId}').innerHTML=''; ${prefix === 'any' ? 'gradingAny' : 'grading'}=null;">Discard</button>
    </div>`;
}

function renderGrading(r) { renderGradingInto('grade-panel', r, 'train'); }

function setGrade(prefix, key, g) {
  const target = prefix === 'any' ? gradingAny : grading;
  if (!target) return;
  target.grades[key] = g;
  document.querySelectorAll(`[data-p="${prefix}"][data-k="${key}"]`).forEach(b =>
    b.classList.toggle('sel', b.dataset.g === g));
}

// Pull any edited attribute values into the payload. The episode is editable
// because the parser cannot know the user's own numbering: a title reading 47
// may be episode 7 of this season.
function collectEdits(prefix, release) {
  const out = JSON.parse(JSON.stringify(release));
  document.querySelectorAll(`input.attr-edit[data-p="${prefix}"]`).forEach(inp => {
    const a = out.attrs.find(x => x.key === inp.dataset.k);
    if (a) a.value = inp.value.trim();
  });
  return out;
}

async function submitGrades() {
  if (!grading) return;
  try {
    const rel = collectEdits('train', grading.release);
    const r = await api('/api/train/grade', {
      title: rel.title,
      episode: grading.episode,
      grades: grading.grades,
      release: rel,
    });
    state = r.state;
    el('grade-panel').innerHTML = '';
    el('teach-title').value = '';
    grading = null;
    banner(r.notes.length ? 'Learned: ' + r.notes.join('; ') : 'No changes.');
    renderTrain();
  } catch (e) { banner(e.message, true); }
}

async function answer(index, accept) {
  try {
    state = await api('/api/train/answer', { index, accept });
    renderTrain();
  } catch (e) { banner(e.message, true); }
}

async function reject(index) {
  const reason = prompt('Why? (wrong_episode, wrong_show, batch, dub, codec, quality, other)', 'wrong_episode');
  if (reason === null) return;
  try {
    state = await api('/api/train/answer', { index, accept: false, reason });
    renderTrain();
  } catch (e) { banner(e.message, true); }
}

async function commit() {
  try {
    const r = await api('/api/train/commit', {});
    const n = (r.verified || []).length;
    banner(`Saved. ${r.accepted} accepted, ${r.rejected} rejected. ${n} release(s) now match ep ${state.episode}.`);
    state = { active: false };
    renderTrain();
    loadShows();
  } catch (e) { banner(e.message, true); }
}

function cancelTrain() {
  state = { active: false };
  renderTrain();
}

loadShows();
</script>
</body>
</html>
