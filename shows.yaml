# kishizu show configuration.
#
# This file is the user's seed: what to track, what has already been seen, and
# what to call each show. It replaces the hardcoded season lists so that adding
# a show is an edit here, not a code change.
#
# Fields:
#   name     - the user's own name for the show. Becomes the canonical name.
#   aliases  - every other title it is known by. Include the romaji title used
#              by animeschedule.net and by release groups, and any native title
#              (Korean webtoon adaptations are listed under their Korean name,
#              e.g. Tomb Raider King airs as "Dogul Wang").
#   watched  - how many episodes you have already seen. Episodes 1..watched are
#              latched as watched, so they are never grabbed.
#   max      - total episodes in the season. 0 = unknown, no upper bound.
#
# Apply with: kishizu -db kishizu.db -config shows.yaml -seed

